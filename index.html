<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OWA Move-Out Sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f0;
    --card:#ffffff;
    --ink:#111111;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#1e40ff;
    --good:#dcfce7;
    --good-ink:#166534;
    --pill:#f3f4f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .hero{background:#0b0b0c;color:#fff;text-align:center;padding:64px 20px 72px}
  .hero h1{font-size:clamp(40px,6vw,72px);font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
  .hero p{margin:0;color:#cfcfd2;font-size:15px;font-weight:500}
  .hero p .dot{margin:0 8px;opacity:.6}
  .hero p a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
  .hero p a:hover{border-bottom-color:#fff}

  .nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .nav a{text-decoration:none;color:var(--ink);background:var(--pill);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid transparent;transition:background .15s,border-color .15s;white-space:nowrap}
  .nav a:hover{background:#e9eaee;border-color:var(--line)}

  main{max-width:1200px;margin:0 auto;padding:32px 20px 80px}

  section{margin:36px 0 8px;scroll-margin-top:80px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
  .section-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .section-head .count{color:var(--muted);font-size:14px;font-weight:500}

  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 6px 24px rgba(0,0,0,.06);transform:translateY(-1px)}
  .thumb{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:contain;padding:12px}
  .badge{display:inline-block;background:var(--accent);color:#fff;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.06em;padding:6px 12px;border-radius:999px}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .body h3{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.3}
  .price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .price{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .orig{color:var(--muted);text-decoration:line-through;font-size:14px;font-weight:500}
  .disc{background:var(--good);color:var(--good-ink);font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px}
  .listing{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;transition:background .15s,border-color .15s}
  .listing:hover{background:#fafafa;border-color:#d1d5db}

  .empty{color:var(--muted);font-size:14px;padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center;background:#fff}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:32px 20px 48px}
</style>
</head>
<body>

<header class="hero">
  <h1>OWA Move-Out Sale</h1>
  <p>
    Available for pickup at One Western Avenue #350
    <span class="dot">·</span>
    Contact: <a href="tel:+18573166575">+1 857 316 6575</a>
  </p>
</header>

<nav class="nav" aria-label="Categories"><div class="nav-inner" id="nav-pills"></div></nav>

<main id="sections"></main>

<footer>Pickup only · One Western Avenue #350 · Text to coordinate</footer>

<script>
  const CATEGORIES = [
    { id: "living",  label: "Living",            emoji: "🛋️" },
    { id: "dining",  label: "Dining & Kitchen",  emoji: "🍽️" },
    { id: "work",    label: "Work",              emoji: "🖥️" },
    { id: "bedroom", label: "Bedroom",           emoji: "🛏️" },
    { id: "others",  label: "Others",            emoji: "📦" }
  ];

  const ITEMS = [
    { category: "Living",           name: "Insignia 58\" LED 4K UHD Smart Fire TV", price: 140, original: 276,    listing: "https://www.amazon.com/dp/B0CMDHXZF8", image: "https://m.media-amazon.com/images/I/815h+HlZe7L._AC_SL1500_.jpg" },
    { category: "Dining & Kitchen", name: "Kitchen Cart Cabinet",                    price: 45,  original: 87.99,  listing: "https://www.amazon.com/dp/B09SYYRN6P", image: "https://m.media-amazon.com/images/I/815D2Pd2kCL._AC_SL1500_.jpg" },
    { category: "Work",             name: "2 x Dell Monitor",                        price: 120, original: 231,    listing: "https://www.amazon.com/dp/B096MXR34N", image: "https://m.media-amazon.com/images/I/81xrHN1BYFL._AC_SL1500_.jpg" },
    { category: "Others",           name: "Sunlight Therapy Lamp",                   price: 60,  original: 119.99, listing: "https://www.amazon.com/dp/B00PCN4UVU", image: "https://m.media-amazon.com/images/I/51+VDKV8DaL._AC_SL1500_.jpg" },
    { category: "Others",           name: "Wall Art - Flourish of Spring",           price: 50,  original: 122.99, listing: "https://www.wayfair.com/decor-pillows/pdp/andover-mills-flourish-of-spring-by-timothy-o-toole-painting-print-on-canvas-w004995523.html?piid=288806472%2C341022279%2C341626477", image: "https://assets.wfcdn.com/im/73296134/resize-h800-p1-w800%5Ecompr-r85/2320/232039390/%22+Flourish+Of+Spring+%22+by+Timothy+O%27+Toole-288806472-341022279-341626477.jpg" },
    { category: "Work",             name: "Standing Desk - Adjustable Height",       price: 120, original: 276.24, listing: "https://www.wayfair.com/furniture/pdp/inbox-zero-emanuiel-height-adjustable-standing-gaming-desk-w007719602.html?piid=942113954", image: "https://assets.wfcdn.com/im/83408579/resize-h1200-p1-w1200%5Ecompr-r85/2865/286583680/Emanuiel+Height+Adjustable+Standing+Gaming+Desk-942113954.jpg" },
    { category: "Living",           name: "TV Stand",                                price: 80,  original: 182.74, listing: "https://www.wayfair.com/furniture/sb0/tv-stands-entertainment-centers-c1868409.html?redir_sku=W011257003", image: "https://assets.wfcdn.com/im/84047580/resize-h100-w100%5Ecompr-r85/2519/251934711/default_name.jpg" },
    { category: "Work",             name: "Office Chair with Padded Arms",           price: 80,  original: 180.61, listing: "https://www.wayfair.com/furniture/pdp/upper-square-kalman-mid-back-leathersoft-executive-swivel-office-chair-with-padded-arms-w006631778.html?piid=1511468187", image: "https://assets.wfcdn.com/im/15284301/resize-h800-p1-w800%5Ecompr-r85/2764/276491894/Kalman+Mid-Back+LeatherSoft+Executive+Swivel+Office+Chair+with+Padded+Arms-1511468187.jpg" },
    { category: "Bedroom",          name: "Dresser",                                 price: 50,  original: 115.80, listing: "https://www.wayfair.com/furniture/pdp/17-stories-forestine-12-drawer-dresser-for-bedroom-w100348196.html?piid=1793041553", image: "https://assets.wfcdn.com/im/47834771/resize-h800-p1-w800%5Ecompr-r85/3583/358304207/Forestine+12-Drawer+Dresser-1793041553.jpg" },
    { category: "Living",           name: "Bamboo Tree",                             price: 80,  original: 172.11, listing: "https://www.wayfair.com/home/pdp/freeport-park-72-tall-high-end-realistic-silk-bamboo-tree-in-basket-w004779990.html?piid=1297287915", image: "https://assets.wfcdn.com/im/31527464/resize-h800-p1-w800%5Ecompr-r85/2166/216608714/72%22+Tall+High+End+Realistic+Silk+Bamboo+Tree+in+Basket-1297287915.jpg" },
    { category: "Living",           name: "Decorative Clock",                        price: 25,  original: 59.49,  listing: "", image: "https://assets.wfcdn.com/im/45183503/resize-h85-w85%5Ecompr-r85/2919/291977135/default_name.jpg" },
    { category: "Bedroom",          name: "Bed Frame - Full/Double",                 price: 65,  original: 152.99, listing: "https://www.wayfair.com/furniture/pdp/17-stories-tharsiga-bed-frame-w009580236.html?piid=1518619331", image: "https://assets.wfcdn.com/im/08527123/resize-h800-p1-w800%5Ecompr-r85/2186/218685387/Tharsiga+Upholstered+Bed-1518619331.jpg" },
    { category: "Bedroom",          name: "Mattress - 9\" Full XL",                  price: 200, original: 403.74, listing: "https://www.wayfair.com/bed-bath/pdp/white-noise-10-inch-medium-plush-pillowtop-innerspring-mattress-w004342109.html?piid=1062180588%2C996683342", image: "https://assets.wfcdn.com/im/23922989/resize-h800-p1-w800%5Ecompr-r85/4388/438824515/10-Inch+Medium+Plush+Pillowtop+Innerspring+Mattress-1062180588-996683342.jpg" },
    { category: "Living",           name: "Coffee Table",                            price: 60,  original: 123.24, listing: "https://www.wayfair.com/furniture/pdp/red-barrel-studio-aspa-lift-top-solid-coffee-table-with-storage-w004286818.html?piid=1100679075%2C1179625892", image: "https://assets.wfcdn.com/im/91007354/resize-h800-p1-w800%5Ecompr-r85/3687/368704986/Aspa+Single+Coffee+Table-1100679075-1179625892.jpg" }
  ];
</script>

<script>
  const fmt = n => "$" + (Number.isInteger(n) ? n : n.toFixed(2));
  const discPct = (p, o) => Math.round((1 - p / o) * 100);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function categoryId(label) {
    const norm = String(label || "").toLowerCase().trim();
    for (const c of CATEGORIES) {
      if (norm === c.label.toLowerCase()) return c.id;
    }
    if (norm.startsWith("living")) return "living";
    if (norm.includes("dining") || norm.includes("kitchen")) return "dining";
    if (norm.includes("work") || norm.includes("office") || norm.includes("desk")) return "work";
    if (norm.includes("bed")) return "bedroom";
    return "others";
  }

  const nav = document.getElementById("nav-pills");
  CATEGORIES.forEach(c => {
    const a = document.createElement("a");
    a.href = "#" + c.id;
    a.textContent = c.emoji + " " + c.label;
    nav.appendChild(a);
  });

  const sectionsEl = document.getElementById("sections");
  CATEGORIES.forEach(c => {
    const items = ITEMS.filter(it => categoryId(it.category) === c.id);
    const section = document.createElement("section");
    section.id = c.id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = '<h2>' + c.emoji + ' ' + esc(c.label) + '</h2><span class="count">' + items.length + ' item' + (items.length === 1 ? '' : 's') + '</span>';
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";

    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No items yet.";
      grid.appendChild(empty);
    } else {
      items.forEach(it => {
        const card = document.createElement("article");
        card.className = "card";
        const d = (it.original && it.price) ? discPct(it.price, it.original) : null;
        const thumbInner = '<img src="' + esc(it.image) + '" alt="' + esc(it.name) + '" loading="lazy" />';
        const thumb = it.listing
          ? '<a class="thumb" href="' + esc(it.listing) + '" target="_blank" rel="noopener">' + thumbInner + '</a>'
          : '<div class="thumb">' + thumbInner + '</div>';
        const listingBtn = it.listing
          ? '<a class="listing" href="' + esc(it.listing) + '" target="_blank" rel="noopener">View original listing &#8599;</a>'
          : "";
        const origHtml = it.original ? '<span class="orig">' + fmt(it.original) + '</span>' : '';
        const discHtml = (d !== null && d > 0) ? '<span class="disc">-' + d + '%</span>' : '';
        card.innerHTML =
          thumb +
          '<div class="body">' +
            '<span class="badge">' + esc(c.label) + '</span>' +
            '<h3>' + esc(it.name) + '</h3>' +
            '<div class="price-row">' +
              '<span class="price">' + fmt(it.price) + '</span>' +
              origHtml +
              discHtml +
            '</div>' +
            listingBtn +
          '</div>';
        grid.appendChild(card);
      });
    }
    section.appendChild(grid);
    sectionsEl.appendChild(section);
  });
</script>

</body>
</html>
