<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OWA Move Out Sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f0;
    --card:#ffffff;
    --ink:#111111;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#1e40ff;
    --good:#dcfce7;
    --good-ink:#166534;
    --pill:#f3f4f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit}
  .hero{background:#0b0b0c;color:#fff;text-align:center;padding:64px 20px 72px}
  .hero h1{font-size:clamp(40px,6vw,72px);font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
  .hero p{margin:0;color:#cfcfd2;font-size:15px;font-weight:500}
  .hero p .dot{margin:0 8px;opacity:.6}
  .hero p a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
  .hero p a:hover{border-bottom-color:#fff}

  .nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .pill{
    cursor:pointer;color:var(--ink);background:var(--pill);
    padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;
    border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;
    white-space:nowrap;
  }
  .pill:hover{background:#e9eaee;border-color:var(--line)}
  .pill.active{background:#0b0b0c;color:#fff;border-color:#0b0b0c}
  .pill.active:hover{background:#000}
  .pill .badge-count{
    display:inline-block;margin-left:6px;font-size:11px;font-weight:700;
    background:rgba(0,0,0,.08);color:inherit;padding:1px 7px;border-radius:999px;
  }
  .pill.active .badge-count{background:rgba(255,255,255,.18);color:#fff}

  main{max-width:1200px;margin:0 auto;padding:32px 20px 80px}

  section{margin:36px 0 8px;scroll-margin-top:80px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
  .section-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .section-head .count{color:var(--muted);font-size:14px;font-weight:500}

  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 6px 24px rgba(0,0,0,.06);transform:translateY(-1px)}
  .thumb{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden;color:var(--muted);font-size:13px}
  .thumb img{width:100%;height:100%;object-fit:contain;padding:12px}
  .badge{display:inline-block;background:var(--accent);color:#fff;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.06em;padding:6px 12px;border-radius:999px}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .body h3{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.3}
  .price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .price{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .orig{color:var(--muted);text-decoration:line-through;font-size:14px;font-weight:500}
  .disc{background:var(--good);color:var(--good-ink);font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px}
  .listing{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;transition:background .15s,border-color .15s}
  .listing:hover{background:#fafafa;border-color:#d1d5db}

  .empty{color:var(--muted);font-size:14px;padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center;background:#fff}

  /* SOLD treatment */
  .card.sold{opacity:.6}
  .card.sold .thumb{position:relative;overflow:hidden}
  .card.sold .thumb::after{
    content:"SOLD";position:absolute;top:18px;left:-38px;
    background:#dc2626;color:#fff;padding:5px 44px;transform:rotate(-22deg);
    font-weight:800;letter-spacing:.12em;font-size:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;
  }
  .card.sold .price{text-decoration:line-through;color:var(--muted)}
  .card.sold .listing{pointer-events:none;opacity:.7}
  .pick.sold{opacity:.55}
  .pick.sold input{cursor:not-allowed}
  .pick .pick-sold-tag{margin-left:auto;color:#dc2626;font-weight:800;font-size:11px;letter-spacing:.06em;flex-shrink:0}

  /* Cart / Build Selection view */
  .cart{margin-top:16px}
  .cart h2{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .cart .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .cart-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .btn{cursor:pointer;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);transition:background .15s,border-color .15s}
  .btn:hover{background:#fafafa;border-color:#d1d5db}
  .btn.primary{background:#0b0b0c;color:#fff;border-color:#0b0b0c}
  .btn.primary:hover{background:#000}
  .cart-empty{padding:18px 20px;background:#fafafa;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;margin-bottom:24px}
  .picker-hint{color:var(--muted);font-size:13px;margin:18px 0 8px}
  .picker{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:background .12s,border-color .12s}
  .pick:hover{background:#fafafa;border-color:#d1d5db}
  .pick.checked{background:#f0f4ff;border-color:#bcccff}
  .pick input{margin:0;width:18px;height:18px;cursor:pointer;accent-color:#0b0b0c;flex-shrink:0}
  .pick .pick-thumb{width:42px;height:42px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .pick .pick-thumb img{width:100%;height:100%;object-fit:contain;padding:3px}
  .pick .pick-thumb.no-img{font-size:9px;color:var(--muted);text-align:center;line-height:1.1;padding:2px}
  .pick .pick-name{flex:1;font-size:13px;font-weight:600;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .pick-price{font-size:13px;font-weight:700;flex-shrink:0;white-space:nowrap}
  .picker-cat{margin-top:18px}
  .picker-cat:first-of-type{margin-top:0}
  .picker-cat-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
  .picker-cat-head .cat-dot{display:inline-block;width:10px;height:10px;border-radius:999px}
  .selected-row td .row-thumb{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);object-fit:contain;background:#fff;padding:2px;vertical-align:middle;margin-right:10px}
  .selected-row td .row-name{font-weight:600;display:inline-block;vertical-align:middle}
  .remove-btn{cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:18px;padding:4px 8px;border-radius:6px;line-height:1}
  .remove-btn:hover{color:#dc2626;background:#fef2f2}

  /* Summary view */
  .summary{margin-top:16px}
  .summary h2{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .summary .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .summary-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .stat .h{color:var(--good-ink);font-size:13px;font-weight:600;margin-top:4px}
  .summary-table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table.summary-table{width:100%;border-collapse:collapse;font-size:14px}
  table.summary-table th,table.summary-table td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  table.summary-table th:first-child,table.summary-table td:first-child{text-align:left}
  table.summary-table thead th{background:#fafafa;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  table.summary-table tbody tr:last-child td{border-bottom:none}
  table.summary-table tfoot td{font-weight:800;background:#fafafa;border-top:2px solid var(--ink)}
  table.summary-table.cart-table thead th:nth-child(2),
  table.summary-table.cart-table tbody td:nth-child(2){text-align:left}
  table.summary-table .cat-dot{display:inline-block;width:10px;height:10px;border-radius:999px;vertical-align:middle;margin-right:8px}
  table.summary-table .pct{color:var(--good-ink);font-weight:700}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:32px 20px 48px}
</style>
</head>

<script>
  const fmt = n => "$" + (Number.isInteger(n) ? n : n.toFixed(2));
  const fmtWhole = n => "$" + Math.round(n).toLocaleString("en-US");
  const discPct = (p, o) => Math.round((1 - p / o) * 100);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function categoryId(label) {
    const norm = String(label || "").toLowerCase().trim();
    for (const c of CATEGORIES) {
      if (norm === c.label.toLowerCase()) return c.id;
    }
    if (norm.startsWith("living")) return "living";
    if (norm.includes("dining") || norm.includes("kitchen")) return "dining";
    if (norm.includes("work") || norm.includes("office") || norm.includes("desk")) return "work";
    if (norm.includes("bed")) return "bedroom";
    return "others";
  }

  // Filter state — persists across reloads.
  let activeFilter = localStorage.getItem("owa-filter") || "all";

  function setFilter(id) {
    activeFilter = id;
    try { localStorage.setItem("owa-filter", id); } catch(e) {}
    applyFilter();
  }

  function applyFilter() {
    document.querySelectorAll(".pill").forEach(p => {
      p.classList.toggle("active", p.dataset.filter === activeFilter);
    });
    const sectionsWrap = document.getElementById("sections");
    const summaryPanel = document.getElementById("summary-panel");
    const cartPanel    = document.getElementById("cart-panel");
    sectionsWrap.style.display = "none";
    summaryPanel.style.display = "none";
    cartPanel.style.display    = "none";

    if (activeFilter === "summary") {
      summaryPanel.style.display = "";
      renderSummary();
    } else if (activeFilter === "cart") {
      cartPanel.style.display = "";
      renderCart();
    } else {
      sectionsWrap.style.display = "";
      document.querySelectorAll("section[data-section]").forEach(s => {
        const show = (activeFilter === "all") || (s.dataset.section === activeFilter);
        s.style.display = show ? "" : "none";
      });
    }
  }

  // ===== Cart =====
  // Persisted set of selected item names.
  let selected = new Set();
  try {
    const raw = localStorage.getItem("owa-cart");
    if (raw) selected = new Set(JSON.parse(raw));
  } catch(e) {}

  function persistCart() {
    try { localStorage.setItem("owa-cart", JSON.stringify([...selected])); } catch(e) {}
  }

  function toggleSelect(name, on) {
    if (on) selected.add(name); else selected.delete(name);
    persistCart();
    if (activeFilter === "cart") renderCart();
    updateCartBadge();
  }

  function clearCart() {
    selected.clear();
    persistCart();
    if (activeFilter === "cart") renderCart();
    updateCartBadge();
  }

  function updateCartBadge() {
    const pill = document.querySelector('.pill[data-filter="cart"]');
    if (!pill) return;
    const cnt = pill.querySelector(".badge-count");
    if (cnt) cnt.textContent = selected.size;
  }

  function renderCart() {
    const panel = document.getElementById("cart-panel");
    const picked = ITEMS.filter(it => selected.has(it.name));
    const sell = picked.reduce((s, it) => s + (it.price || 0), 0);
    const orig = picked.reduce((s, it) => s + (it.original || 0), 0);
    const save = orig - sell;
    const pct  = orig > 0 ? Math.round((1 - sell / orig) * 100) : 0;

    const stats = `
      <div class="summary-cards">
        <div class="stat"><div class="l">Items Selected</div><div class="v">${picked.length}</div></div>
        <div class="stat"><div class="l">Selling Price Total</div><div class="v">${fmtWhole(sell)}</div></div>
        <div class="stat"><div class="l">Original Price Total</div><div class="v">${fmtWhole(orig)}</div></div>
        <div class="stat"><div class="l">Discount Total</div><div class="v">${fmtWhole(save)}</div><div class="h">${orig > 0 ? '−' + pct + '% off retail' : ''}</div></div>
      </div>`;

    let selectedTable;
    if (picked.length === 0) {
      selectedTable = `<div class="cart-empty">No items selected yet — pick some below to build your list.</div>`;
    } else {
      const rows = picked.map(it => {
        const c = CATEGORIES.find(c => c.id === categoryId(it.category)) || CATEGORIES[CATEGORIES.length - 1];
        const d = (it.original && it.price) ? discPct(it.price, it.original) : null;
        const thumb = it.image
          ? `<img class="row-thumb" src="${esc(it.image)}" alt="" loading="lazy" />`
          : '';
        return `
          <tr class="selected-row">
            <td>${thumb}<span class="row-name">${esc(it.name)}</span></td>
            <td><span class="cat-dot" style="background:${c.color}"></span>${esc(c.label)}</td>
            <td>${fmt(it.price)}</td>
            <td>${fmtWhole(it.original)}</td>
            <td class="pct">${d !== null && d > 0 ? '-' + d + '%' : ''}</td>
            <td><button class="remove-btn" title="Remove" data-remove="${esc(it.name)}">×</button></td>
          </tr>`;
      }).join("");
      selectedTable = `
        <div class="summary-table-wrap">
          <table class="summary-table cart-table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Selling Price</th>
                <th>Original Price</th>
                <th>Discount %</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
              <tr>
                <td colspan="2">Total</td>
                <td>${fmt(sell)}</td>
                <td>${fmtWhole(orig)}</td>
                <td class="pct">${orig > 0 ? '-' + pct + '%' : ''}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>`;
    }

    // Picker grouped by category
    const picker = CATEGORIES.map(c => {
      const items = ITEMS.filter(it => categoryId(it.category) === c.id);
      if (items.length === 0) return "";
      const cards = items.map(it => {
        const checked = selected.has(it.name);
        const thumb = it.image
          ? `<div class="pick-thumb"><img src="${esc(it.image)}" alt="" loading="lazy" /></div>`
          : `<div class="pick-thumb no-img">No image</div>`;
        const cls = "pick" + (checked ? " checked" : "") + (it.sold ? " sold" : "");
        const soldTag = it.sold ? '<span class="pick-sold-tag">SOLD</span>' : `<span class="pick-price">${fmt(it.price)}</span>`;
        return `
          <label class="${cls}" title="${it.sold ? 'Sold — not available' : esc(it.name)}">
            <input type="checkbox" data-name="${esc(it.name)}"${checked ? " checked" : ""}${it.sold ? " disabled" : ""} />
            ${thumb}
            <span class="pick-name">${esc(it.name)}</span>
            ${soldTag}
          </label>`;
      }).join("");
      return `
        <div class="picker-cat">
          <div class="picker-cat-head"><span class="cat-dot" style="background:${c.color}"></span>${c.emoji} ${esc(c.label)}</div>
          <div class="picker">${cards}</div>
        </div>`;
    }).join("");

    panel.innerHTML = `
      <h2>🛒 Build Your Selection</h2>
      <p class="sub">Tick the items you want — totals update live. Saved in your browser.</p>
      ${stats}
      <div class="cart-actions">
        <button class="btn" id="cart-clear">Clear selection</button>
      </div>
      ${selectedTable}
      <div class="picker-hint">Add items:</div>
      ${picker}
    `;

    // Wire up checkboxes
    panel.querySelectorAll('input[type="checkbox"][data-name]').forEach(cb => {
      cb.addEventListener("change", e => toggleSelect(e.target.dataset.name, e.target.checked));
    });
    panel.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener("click", () => toggleSelect(btn.dataset.remove, false));
    });
    const clearBtn = panel.querySelector("#cart-clear");
    if (clearBtn) clearBtn.onclick = clearCart;
  }

  function renderSummary() {
    const panel = document.getElementById("summary-panel");
    const available = ITEMS.filter(it => !it.sold);
    const soldCount = ITEMS.length - available.length;
    const rows = CATEGORIES.map(c => {
      const items = available.filter(it => categoryId(it.category) === c.id);
      const sell = items.reduce((s, it) => s + (it.price || 0), 0);
      const orig = items.reduce((s, it) => s + (it.original || 0), 0);
      const save = orig - sell;
      const pct = orig > 0 ? Math.round((1 - sell / orig) * 100) : 0;
      return { c, count: items.length, sell, orig, save, pct };
    });
    const tot = rows.reduce((a, r) => ({
      count: a.count + r.count,
      sell:  a.sell  + r.sell,
      orig:  a.orig  + r.orig,
    }), { count: 0, sell: 0, orig: 0 });
    tot.save = tot.orig - tot.sell;
    tot.pct  = tot.orig > 0 ? Math.round((1 - tot.sell / tot.orig) * 100) : 0;

    const tableRows = rows.map(r => `
      <tr>
        <td><span class="cat-dot" style="background:${r.c.color}"></span>${r.c.emoji} ${esc(r.c.label)}</td>
        <td>${r.count}</td>
        <td>${fmtWhole(r.sell)}</td>
        <td>${fmtWhole(r.orig)}</td>
        <td>${fmtWhole(r.save)}</td>
        <td class="pct">-${r.pct}%</td>
      </tr>`).join("");

    panel.innerHTML = `
      <h2>📊 Summary</h2>
      ${soldCount > 0 ? `<p class="sub">${soldCount} item${soldCount === 1 ? '' : 's'} already sold — excluded from totals below.</p>` : ''}

      <div class="summary-cards">
        <div class="stat"><div class="l">Items</div><div class="v">${tot.count}</div></div>
        <div class="stat"><div class="l">Selling Price Total</div><div class="v">${fmtWhole(tot.sell)}</div></div>
        <div class="stat"><div class="l">Original Price Total</div><div class="v">${fmtWhole(tot.orig)}</div></div>
        <div class="stat"><div class="l">Discount Total</div><div class="v">${fmtWhole(tot.save)}</div><div class="h">−${tot.pct}% off retail</div></div>
      </div>

      <div class="summary-table-wrap">
        <table class="summary-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Items</th>
              <th>Selling Price Total</th>
              <th>Original Price Total</th>
              <th>Discount Total</th>
              <th>Discount %</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
          <tfoot>
            <tr>
              <td>Total</td>
              <td>${tot.count}</td>
              <td>${fmtWhole(tot.sell)}</td>
              <td>${fmtWhole(tot.orig)}</td>
              <td>${fmtWhole(tot.save)}</td>
              <td class="pct">-${tot.pct}%</td>
            </tr>
          </tfoot>
        </table>
      </div>
    `;
  }

  // Build nav: All + each category + Summary
  const nav = document.getElementById("nav-pills");
  const totalCount = ITEMS.length;
  nav.appendChild(makePill("all", "🏷️ All", totalCount));
  CATEGORIES.forEach(c => {
    const count = ITEMS.filter(it => categoryId(it.category) === c.id).length;
    nav.appendChild(makePill(c.id, c.emoji + " " + c.label, count));
  });
  nav.appendChild(makePill("cart",    "🛒 Build Cart", selected.size));
  nav.appendChild(makePill("summary", "📊 Summary",     null));

  function makePill(id, label, count) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill";
    b.dataset.filter = id;
    const countHtml = (count != null) ? ' <span class="badge-count">' + count + '</span>' : '';
    b.innerHTML = esc(label) + countHtml;
    b.onclick = () => setFilter(id);
    return b;
  }

  // Build sections
  const sectionsEl = document.getElementById("sections");
  CATEGORIES.forEach(c => {
    const items = ITEMS.filter(it => categoryId(it.category) === c.id);
    const section = document.createElement("section");
    section.id = c.id;
    section.dataset.section = c.id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = '<h2>' + c.emoji + ' ' + esc(c.label) + '</h2><span class="count">' + items.length + ' item' + (items.length === 1 ? '' : 's') + '</span>';
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";

    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No items yet.";
      grid.appendChild(empty);
    } else {
      items.forEach(it => {
        const card = document.createElement("article");
        card.className = "card" + (it.sold ? " sold" : "");
        const d = (it.original && it.price) ? discPct(it.price, it.original) : null;
        const thumbInner = it.image
          ? '<img src="' + esc(it.image) + '" alt="' + esc(it.name) + '" loading="lazy" />'
          : '<span>No image</span>';
        const thumb = it.listing
          ? '<a class="thumb" href="' + esc(it.listing) + '" target="_blank" rel="noopener">' + thumbInner + '</a>'
          : '<div class="thumb">' + thumbInner + '</div>';
        const listingBtn = it.listing
          ? '<a class="listing" href="' + esc(it.listing) + '" target="_blank" rel="noopener">View original listing &#8599;</a>'
          : '';
        const origHtml = it.original ? '<span class="orig">' + fmt(it.original) + '</span>' : '';
        const discHtml = (d !== null && d > 0) ? '<span class="disc">-' + d + '%</span>' : '';
        card.innerHTML =
          thumb +
          '<div class="body">' +
            '<span class="badge" style="background:' + c.color + '">' + esc(c.label) + '</span>' +
            '<h3>' + esc(it.name) + '</h3>' +
            '<div class="price-row">' +
              '<span class="price">' + fmt(it.price) + '</span>' +
              origHtml +
              discHtml +
            '</div>' +
            listingBtn +
          '</div>';
        grid.appendChild(card);
      });
    }
    section.appendChild(grid);
    sectionsEl.appendChild(section);
  });

  // Apply current filter (defaults to "all")
  applyFilter();
</script>

</body>
</html>
